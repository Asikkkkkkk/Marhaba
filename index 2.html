<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e3b2c">
<title>Marhaba Tea House</title>
<style>
:root{--emerald:#0e3b2c;--emerald-2:#17543f;--cream:#f5ecd6;--paper:#fbf6ea;--gold:#c9a24a;--gold-dark:#8a6a24;--ink:#17261f;--muted:#5f6f64;--line:#d8c7a0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--cream) url("assets/bg-cream.jpg") center top/cover fixed no-repeat;padding-bottom:110px}

/* ---------- Выбор языка (угол) ---------- */
.langsel{position:fixed;top:10px;right:10px;z-index:40;background:var(--emerald);color:var(--cream);border:1px solid var(--gold);border-radius:999px;padding:7px 12px;font:600 13px system-ui,-apple-system,sans-serif;cursor:pointer;outline:none}

/* ---------- Приветствие ---------- */
.hero{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;color:var(--cream);background:var(--emerald) url("assets/bg-green.jpg") center/cover fixed no-repeat;padding:56px 20px 28px}
.hero-mid{display:flex;flex-direction:column;align-items:center;gap:16px;margin:auto 0}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:clamp(28px,8vw,44px);color:var(--gold);margin:0;line-height:1.2}
.hero .sub{margin:0;font-size:16px;opacity:.9}
.btn-main{background:var(--gold);color:#1b1408;border:0;border-radius:999px;padding:16px 60px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:.5px;margin-top:10px}
.contacts{display:flex;gap:18px;justify-content:center}
.contacts a{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);text-decoration:none}
.contacts svg{width:22px;height:22px;fill:currentColor}

/* ---------- Меню ---------- */
#menuScreen{padding-top:0}
#menuScreen.green{background:var(--emerald) url("assets/bg-green.jpg") center/cover fixed no-repeat;min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 130px 10px 14px;background:var(--emerald);color:var(--cream);border-bottom:2px solid var(--gold)}
.topbar .brand{font-family:Georgia,serif;font-size:20px;flex:1;letter-spacing:.5px}
.back{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:10px;padding:14px 16px 4px;max-width:640px;margin:0 auto}
.tab{flex:1;padding:14px;border-radius:14px;border:1px solid var(--emerald);background:var(--paper);color:var(--emerald);font-size:17px;font-weight:700;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--emerald);color:var(--cream);border-color:var(--gold)}
main{max-width:640px;margin:0 auto;padding:6px 16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--paper);border:1px solid var(--gold);border-radius:14px;padding:22px 10px;min-height:76px;font-size:16px;font-weight:600;color:var(--emerald);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:normal;color:var(--emerald);font-size:26px;margin:14px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--gold)}
.list{background:var(--paper);border-radius:14px;padding:2px 14px 8px;margin-top:8px;border:1px solid var(--line)}
h3.sub{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dark);margin:16px 0 0}
.item,.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dotted var(--line)}
.item:last-child,.line:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:12px;flex:none;overflow:hidden;background:linear-gradient(135deg,#ecdfbf,#d8c7a0);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0}
.name{font-weight:600;color:var(--emerald)}
.desc{font-size:13px;color:var(--muted);margin-top:2px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.price{font-weight:700;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.add,.qbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--emerald);color:var(--cream);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.qbtn{background:var(--paper);color:var(--emerald);border:1px solid var(--emerald)}
.count{min-width:20px;text-align:center;font-weight:700}
.note{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 0;line-height:1.5}
footer{max-width:640px;margin:20px auto 0;padding:0 16px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center}
#menuScreen.green footer{color:var(--cream)}

/* ---------- Корзина ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--emerald);box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.bar button{width:100%;display:flex;justify-content:center;align-items:center;padding:14px 16px;border:0;border-radius:12px;background:var(--gold);color:#1b1408;font-size:16px;font-weight:700;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,28,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:Georgia,serif;font-size:22px;color:var(--emerald);margin-bottom:6px}
.close{background:none;border:0;font-size:28px;line-height:1;color:var(--emerald);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.row.big{font-size:19px;font-weight:700;color:var(--emerald);border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
label.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;font-size:15px}
input:not([type=radio]){font:inherit;font-size:16px;width:110px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
textarea{width:100%;height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--emerald);background:var(--emerald);color:var(--cream);font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--emerald)}
.status{min-height:20px;font-size:14px;color:var(--emerald);margin:10px 0 0}
#billBox{margin-top:8px;padding-top:4px;border-top:1px dashed var(--gold)}

/* ---------- Выбор добавки (чай) ---------- */
.modal{max-width:640px;width:100%;background:var(--cream);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-family:Georgia,serif;font-weight:normal;color:var(--emerald);font-size:22px;margin:0 0 4px}
.modal .mprice{font-size:16px;font-weight:700;color:var(--emerald);margin-bottom:8px}
.radio{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px dotted var(--line);font-size:16px;cursor:pointer}
.radio input{margin-right:10px;accent-color:var(--emerald);width:18px;height:18px}
</style>
</head>
<body>

<!-- Выбор языка: всегда в углу -->
<select id="langSel" class="langsel" aria-label="Language">
  <option value="kk">Қазақша</option>
  <option value="ru">Русский</option>
  <option value="en">English</option>
</select>

<!-- ===== Приветствие ===== -->
<section id="welcome" class="hero">
  <div></div>
  <div class="hero-mid">
    <h1>Мархаба - төрлетініз!</h1>
    <p class="sub" id="welcomeSub"></p>
    <button id="toMenu" class="btn-main" type="button"></button>
  </div>

  <nav class="contacts" aria-label="Контакты">

    </a>
  </nav>
</section>

<!-- ===== Меню ===== -->
<div id="menuScreen" hidden>
  <header class="topbar">
    <button id="backBtn" class="back" type="button"></button>
    <span class="brand">Marhaba</span>
  </header>
  <div id="tabs" class="tabs"></div>
  <main id="content"></main>
  <footer id="footNote"></footer>
</div>

<!-- Плавающая панель корзины (только в меню, без цен) -->
<div id="bar" class="bar" hidden>
  <button id="openCart" type="button"><span id="barCount"></span></button>
</div>

<!-- Корзина -->
<div id="drawer" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <span id="cartTitle"></span>
      <button id="closeCart" class="close" type="button" aria-label="×">×</button>
    </div>
    <div id="cartLines"></div>
    <label class="field"><span id="tableLabel"></span>
      <input id="table" type="text" inputmode="numeric" maxlength="3" placeholder="—">
    </label>
    <button id="waiterBtn" class="btn" type="button"></button>

    <div id="billBox" hidden>
      <div id="totals"></div>
      <textarea id="orderText" readonly></textarea>
      <button id="copyBtn" class="btn ghost" type="button"></button>
      <a id="waLink" class="btn ghost" href="#" target="_blank" rel="noopener" hidden></a>
    </div>

    <button id="clearBtn" class="btn ghost" type="button"></button>
    <p id="status" class="status" role="status"></p>
  </div>
</div>

<!-- Выбор добавки (чай) -->
<div id="modal" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalPrice" class="mprice"></div>
    <div id="modalOpts"></div>
    <button id="modalAdd" class="btn" type="button"></button>
    <button id="modalCancel" class="btn ghost" type="button"></button>
  </div>
</div>

const CART_KEY = 'marhaba-cart';
const TABLE_KEY = 'marhaba-table';

// ===== Утилиты =====
function $(id) { return document.getElementById(id); }
function t(k) { return (T[lang] && T[lang][k]) || T.ru[k] || k; }
function gName(g) { return g[lang] || g.ru; }
function nm(it) { return it.n[lang] || it.n.ru; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return n.toLocaleString('ru-RU') + ' ₸'; }
function pct() { return Math.round(CONFIG.serviceRate * 100) + '%'; }

// ===== Корзина =====
function loadCart() {
  try {
    const raw = JSON.parse(localStorage.getItem(CART_KEY) || '{}');
    const out = {};
    for (const k in raw) {
      const e = raw[k];
      if (!e || !ITEMS[e.id] || ITEMS[e.id].p == null) continue;
      if (e.addon && !ADDONS[e.addon]) continue;
      if (Number(e.qty) > 0) out[k] = { id: e.id, addon: e.addon || '', qty: Number(e.qty) };
    }
    return out;
  } catch (e) { return {}; }
}
let cart = loadCart();

function saveCart() {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {}
}
function keyFor(id, addon) { return addon ? id + '|' + addon : id; }
function lineUnit(e) { return ITEMS[e.id].p + (e.addon ? ADDONS[e.addon].p : 0); }
function lineName(e) { return nm(ITEMS[e.id]) + (e.addon ? ' + ' + t(e.addon) : ''); }
function qtyFor(id) {
  let n = 0;
  for (const k in cart) if (cart[k].id === id) n += cart[k].qty;
  return n;
}

function changeKey(key, d) {
  const [id, addon] = key.split('|');
  if (!ITEMS[id] || ITEMS[id].p == null) return;
  if (!cart[key]) {
    if (d <= 0) return;
    cart[key] = { id, addon: addon || '', qty: 0 };
  }
  cart[key].qty += d;
  if (cart[key].qty <= 0) delete cart[key];
  if (!Object.keys(cart).length) waiterMode = false;
  saveCart();
  renderAll();
}

function totals() {
  let sub = 0, count = 0;
  for (const k in cart) {
    sub += lineUnit(cart[k]) * cart[k].qty;
    count += cart[k].qty;
  }
  const svc = Math.round(sub * CONFIG.serviceRate);
  return { sub, count, svc, total: sub + svc };
}

// ===== Кнопки количества =====
function ctlHtml(ctl) {
  if (ctl.indexOf('a:') === 0) {
    const id = ctl.slice(2);
    const n = qtyFor(id);
    return `<button class="add" type="button" data-act="open" data-id="${id}" aria-label="${t('add')}">+</button>` +
           (n ? `<span class="count">${n}</span>` : '');
  }
  const q = cart[ctl] ? cart[ctl].qty : 0;
  if (!q) return `<button class="add" type="button" data-act="inc" data-key="${ctl}" aria-label="${t('add')}">+</button>`;
  return `<button class="qbtn" type="button" data-act="dec" data-key="${ctl}" aria-label="−">−</button>` +
         `<span class="count">${q}</span>` +
         `<button class="qbtn" type="button" data-act="inc" data-key="${ctl}" aria-label="+">+</button>`;
}

// ===== Отрисовка меню =====
// Фото блюд: файл assets/dishes/<id>.jpg, где <id> — например 'mains-4' (Казан-кебаб).
// Если файла нет, миниатюра просто убирается (onerror).
function itemHtml(it) {
  const price = it.p == null ? t('tba') : fmt(it.p);
  let ctl = '';
  if (it.p != null) {
    const ctlKey = it.a ? 'a:' + it.id : it.id;
    ctl = `<div class="ctl">${ctlHtml(ctlKey)}</div>`;
  }
  return `<div class="item">
    <div class="thumb"><img src="assets/dishes/${it.id}.jpg" alt="" loading="lazy" onerror="this.remove()"></div>
    <div class="info">
      <div class="name">${esc(nm(it))}</div>
      ${it.d ? `<div class="desc">${esc(it.d[lang] || it.d.ru)}</div>` : ''}
    </div>
    <div class="side">
      <div class="price">${price}</div>
      ${ctl}
    </div>
  </div>`;
}

function catHtml(cid) {
  const cat = CATS[cid];
  let html = '', lastGroup = null;
  for (const it of cat.items) {
    if (it.g && (!lastGroup || it.g.ru !== lastGroup)) {
      html += `<h3 class="sub">${esc(gName(it.g))}</h3>`;
      lastGroup = it.g.ru;
    }
    html += itemHtml(it);
  }
  return `<h2>${esc(gName(cat.t))}</h2><div class="list">${html}</div>`;
}

function renderScreen() {
  const welcome = view.screen === 'welcome';
  $('welcome').hidden = !welcome;
  $('menuScreen').hidden = welcome;
  if (welcome) return;

  // Главное меню (разделы) — зелёный фон; внутри раздела — кремовый
  $('menuScreen').classList.toggle('green', !view.cat);

  const dept = DEPTS[view.dept];
  $('tabs').innerHTML = Object.keys(DEPTS).map(k =>
    `<button class="tab" type="button" data-dept="${k}" aria-pressed="${k === view.dept}">${esc(gName(DEPTS[k].t))}</button>`
  ).join('');

  if (view.cat) {
    $('content').innerHTML = catHtml(view.cat);
  } else {
    $('content').innerHTML = `<div class="cards">` + dept.cats.map(cid =>
      `<button class="card" type="button" data-open-cat="${cid}">${esc(gName(CATS[cid].t))}</button>`
    ).join('') + `</div>`;
  }
  $('footNote').textContent = t('allergy');
}

  $('bar').hidden = view.screen !== 'menu' || tot.count === 0;
  $('barCount').textContent = `${t('cart')} · ${tot.count}`;
}

function renderCart() {
  const keys = Object.keys(cart);
  // Список без цен: только то, что набрали
  $('cartLines').innerHTML = keys.length
    ? keys.map(k => {
        const e = cart[k];
        return `<div class="line">
          <div class="info"><div class="name">${esc(lineName(e))}</div></div>
          <div class="ctl">${ctlHtml(k)}</div>
        </div>`;
      }).join('')
    : `<p class="empty">${t('cartEmpty')}</p>`;

  $('waiterBtn').hidden = !keys.length || waiterMode;
  $('billBox').hidden = !waiterMode;
  if (waiterMode) {
    const tot = totals();
    $('totals').innerHTML =
      `<div class="row"><span>${t('sum')}</span><span>${fmt(tot.sub)}</span></div>` +
      `<div class="row"><span>${t('service')} ${pct()}</span><span>${fmt(tot.svc)}</span></div>` +
      `<div class="row big"><span>${t('total')}</span><span>${fmt(tot.total)}</span></div>`;
    updateOrder();
  }
}

function buildOrder() {
  const tot = totals();
  const table = $('table').value;
  const lines = Object.keys(cart).map(k => {
    const e = cart[k];
    return `${lineName(e)} × ${e.qty} — ${fmt(lineUnit(e) * e.qty)}`;
  });
  return t('orderTitle') +
    (table ? `\n${t('tableWord')}${table}` : '') +
    '\n\n' + (lines.length ? lines.join('\n') : t('cartEmpty')) +
    `\n\n${t('sum')}: ${fmt(tot.sub)}` +
    `\n${t('service')} ${pct()}: ${fmt(tot.svc)}` +
    `\n${t('total')}: ${fmt(tot.total)}`;
}

function updateOrder() {
  const text = buildOrder();
  $('orderText').value = text;
  if (CONFIG.whatsapp) {
    $('waLink').href = 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(text);
    $('waLink').hidden = false;
  } else {
    $('waLink').hidden = true;
  }
}

function setStatus(msg) { $('status').textContent = msg; }

function copyOrder() {
  if (!Object.keys(cart).length) { setStatus(t('copyEmpty')); return; }
  const text = $('orderText').value;
  const done = () => setStatus(t('copied'));
  const fallback = () => {
    const ta = $('orderText');
    ta.removeAttribute('readonly');
    ta.select();
    ta.setAttribute('readonly', '');
    try { document.execCommand('copy'); done(); }
    catch (e) { setStatus(text); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

function openDrawer() { waiterMode = false; $('drawer').hidden = false; renderCart(); }
function closeDrawer() { waiterMode = false; $('drawer').hidden = true; }

// ===== Сборка экрана =====
function renderAll() {
  applyStatic();
  renderScreen();
  renderBar();
  if (!$('drawer').hidden) renderCart();
}

function setupContacts() {
  const set = (id, href, on) => {
    const a = $(id);
    if (!on) { a.hidden = true; return; }
    a.href = href;
    a.hidden = false;
  };
  set('cPhone', 'tel:+' + CONFIG.phone, !!CONFIG.phone);
  set('cInsta', 'https://instagram.com/' + CONFIG.instagram, !!CONFIG.instagram);
  set('cWa', 'https://wa.me/' + CONFIG.whatsapp, !!CONFIG.whatsapp);
}

function setupTable() {
  const fromUrl = new URLSearchParams(location.search).get('table');
  let saved = null;
  try { saved = localStorage.getItem(TABLE_KEY); } catch (e) {}
  $('table').value = String(fromUrl || saved || '').replace(/\D/g, '').slice(0, 3);
}

// ===== Обработчики =====
function wire() {
  $('langSel').addEventListener('change', e => setLang(e.target.value));

  $('toMenu').addEventListener('click', () => {
    view = { screen: 'menu', dept: 'kitchen', cat: null };
    renderAll();
    window.scrollTo(0, 0);
  });
  $('backBtn').addEventListener('click', () => {
    if (view.cat) view.cat = null;
    else view = { screen: 'welcome', dept: 'kitchen', cat: null };
    renderAll();
    window.scrollTo(0, 0);
  });
  $('openCart').addEventListener('click', openDrawer);
  $('closeCart').addEventListener('click', closeDrawer);
  $('drawer').addEventListener('click', e => { if (e.target === $('drawer')) closeDrawer(); });
  $('waiterBtn').addEventListener('click', () => { waiterMode = true; renderCart(); });
  $('clearBtn').addEventListener('click', () => { cart = {}; waiterMode = false; saveCart(); setStatus(''); renderAll(); });
  $('copyBtn').addEventListener('click', copyOrder);
  $('table').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
    try { localStorage.setItem(TABLE_KEY, e.target.value); } catch (err) {}
    updateOrder();
  });
  $('modalAdd').addEventListener('click', confirmAddon);
  $('modalCancel').addEventListener('click', closeAddon);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeAddon(); });
  $('modalOpts').addEventListener('change', updateModalPrice);

  document.addEventListener('click', e => {
    const c = sel => (e.target.closest ? e.target.closest(sel) : null);
    let b;
    if ((b = c('[data-act]'))) {
      if (b.dataset.act === 'open') openAddon(b.dataset.id);
      else changeKey(b.dataset.key, b.dataset.act === 'inc' ? 1 : -1);
      return;
    }
    if ((b = c('[data-dept]'))) { view.dept = b.dataset.dept; view.cat = null; renderAll(); window.scrollTo(0, 0); return; }
    if ((b = c('[data-open-cat]'))) { view.cat = b.dataset.openCat; renderAll(); window.scrollTo(0, 0); return; }
  });
}

function init() {
  setupContacts();
  setupTable();
  wire();
  renderAll();
}

init();
</script>
</body>
</html>
