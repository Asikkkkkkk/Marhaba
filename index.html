.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 120px 8px max(14px,env(safe-area-inset-left,0px));background:var(--emerald);color:var(--cream);border-bottom:2px solid var(--gold)}
.topbar .brand{font-family:Georgia,serif;font-size:clamp(17px,5vw,20px);min-width:0;flex:1;letter-spacing:.5px;color:var(--gold)}
.back{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:8px 12px;min-height:40px;cursor:pointer;font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.searchbox input{width:100%;font:inherit;font-size:16px;padding:13px 14px 13px 42px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);outline:none}
.searchbox input:focus{border-color:var(--gold)}
.depts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dept{overflow:hidden;padding:0;border:1px solid var(--gold);border-radius:16px;background:var(--paper);color:var(--emerald);font:700 clamp(14px,4.2vw,16px) system-ui,-apple-system,sans-serif;text-align:left;min-width:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dept.on{background:var(--emerald);color:var(--cream)}
.dept .pic{display:block;height:clamp(64px,20vw,92px);overflow:hidden;background:linear-gradient(135deg,#ecdfbf,#d8c7a0)}
.dept .pic img{width:100%;height:100%;object-fit:cover;display:block}
.dept .label{display:block;padding:10px 12px 12px}
.pills{display:flex;gap:10px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:11px 18px;min-height:44px;flex:none;border-radius:999px;border:0;background:var(--paper);color:var(--ink);font:600 clamp(14px,4vw,15px) system-ui,-apple-system,sans-serif;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pill[aria-pressed="true"]{background:var(--emerald);color:var(--cream)}
h2.cat{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:clamp(22px,6.8vw,28px);color:var(--ink);margin:22px 0 4px;overflow-wrap:anywhere}
h3.sub{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dark);margin:16px 0 0;padding:0 14px}
.list{background:var(--paper);border-radius:16px;padding:0 14px;margin-top:8px;border:1px solid var(--line)}
.list > .item:last-child{border-bottom:0}
.item{display:grid;grid-template-columns:clamp(74px,27vw,112px) minmax(0,1fr);gap:clamp(10px,3.5vw,14px);padding:14px 0;border-bottom:1px solid var(--line)}
.thumb{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#ecdfbf,#d8c7a0)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{display:flex;flex-direction:column;min-width:0}
.name{font-weight:700;color:var(--ink);line-height:1.3;font-size:clamp(15px,4.2vw,17px);overflow-wrap:anywhere}
.desc{font-size:clamp(13px,3.8vw,14px);color:var(--muted);margin-top:4px;line-height:1.35}
.foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.add,.qbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--emerald);color:var(--cream);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.qbtn{background:var(--paper);color:var(--emerald);border:1px solid var(--emerald)}
.count{min-width:20px;text-align:center;font-weight:700}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dotted var(--line)}
.line:last-child{border-bottom:0}
.line .info{flex:1}
footer{max-width:640px;margin:20px auto 0;padding:0 16px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center}

/* Плавающая корзина */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 32px));z-index:15}
.bar button{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;padding:15px;min-height:52px;border:0;border-radius:999px;background:var(--emerald);color:var(--cream);font:700 clamp(15px,4.4vw,17px) system-ui,-apple-system,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,28,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font-family:Georgia,serif;font-size:22px;color:var(--emerald);margin-bottom:6px}
.close{background:none;border:0;font-size:28px;line-height:1;color:var(--emerald);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.row.big{font-size:19px;font-weight:700;color:var(--emerald);border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
label.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0;font-size:15px}
input:not([type=radio]){font:inherit;font-size:16px;width:110px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
textarea{width:100%;height:150px;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--emerald);background:var(--emerald);color:var(--cream);font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--emerald)}
.status{min-height:20px;font-size:14px;color:var(--emerald);margin:10px 0 0}
#billBox{margin-top:8px;padding-top:4px;border-top:1px dashed var(--gold)}

/* ---------- Выбор добавки (чай) ---------- */
.modal{max-width:640px;width:100%;background:var(--cream);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-family:Georgia,serif;font-weight:normal;color:var(--emerald);font-size:22px;margin:0 0 4px}
.modal .mprice{font-size:16px;font-weight:700;color:var(--emerald);margin-bottom:8px}
.radio{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px dotted var(--line);font-size:16px;cursor:pointer}
.radio input{margin-right:10px;accent-color:var(--emerald);width:18px;height:18px}

/* ---------- Адаптация под телефоны ---------- */
button,a{touch-action:manipulation}
.menu-body,.item,.line{min-width:0}
@media (max-width:360px){
  .item{grid-template-columns:72px minmax(0,1fr)}
  .hero .sub{font-size:15px}
  .dept .label{padding:8px 10px 10px}
  .topbar{padding-right:110px}
}
@media (max-height:520px) and (orientation:landscape){
  .hero{padding-top:44px;padding-bottom:16px}
  .hero-mid{margin:8px 0;gap:10px}
  .btn-main{margin-top:4px}
}

// ===== Состояние =====
const LANGS = ['kk', 'ru', 'en'];
let lang = (() => { try { const l = localStorage.getItem('marhaba-lang'); return LANGS.includes(l) ? l : 'kk'; } catch (e) { return 'kk'; } })();
let view = { screen: 'welcome', dept: 'kitchen', cat: null };
let searchQ = '';
let addonFor = null;
let waiterMode = false;   // показана ли сумма официанту

const CART_KEY = 'marhaba-cart';
const TABLE_KEY = 'marhaba-table';

// ===== Утилиты =====
function $(id) { return document.getElementById(id); }
function t(k) { return (T[lang] && T[lang][k]) || T.ru[k] || k; }
function gName(g) { return g[lang] || g.ru; }
function nm(it) { return it.n[lang] || it.n.ru; }
function descOf(it) { return it.d ? (it.d[lang] || it.d.ru) : ''; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(n) { return n.toLocaleString('ru-RU') + ' ₸'; }
function pct() { return Math.round(CONFIG.serviceRate * 100) + '%'; }
const digits = v => String(v || '').replace(/\D/g, '');
const handle = v => String(v || '').replace(/[^A-Za-z0-9._]/g, '');

// ===== Корзина: данные =====
function keyFor(id, addon) { return addon ? id + '|' + addon : id; }
function lineUnit(e) { return ITEMS[e.id].p + (e.addon ? ADDONS[e.addon].p : 0); }
function lineName(e) { return nm(ITEMS[e.id]) + (e.addon ? ' + ' + t(e.addon) : ''); }
function qtyFor(id) {
  let n = 0;
  for (const k in cart) if (cart[k].id === id) n += cart[k].qty;
  return n;
}
function loadCart() {
  try {
    const raw = JSON.parse(localStorage.getItem(CART_KEY) || '{}');
    const out = {};
    for (const k in raw) {
      const e = raw[k];
      if (!e || !ITEMS[e.id] || ITEMS[e.id].p == null) continue;
      if (e.addon && !ADDONS[e.addon]) continue;
      const qty = Math.floor(Number(e.qty));
      if (!(qty >= 1 && qty <= 99)) continue;
      // ключ пересобираем из проверенных полей, а не берём из хранилища
      out[keyFor(e.id, e.addon || '')] = { id: e.id, addon: e.addon || '', qty };
    }
    return out;
  } catch (e) { return {}; }
}
let cart = loadCart();
function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {} }

function changeKey(key, d) {
  const [id, addon] = key.split('|');
  if (!ITEMS[id] || ITEMS[id].p == null) return;
  if (!cart[key]) {
    if (d <= 0) return;
    cart[key] = { id, addon: addon || '', qty: 0 };
  }
  cart[key].qty += d;
  if (cart[key].qty <= 0) delete cart[key];
  if (!Object.keys(cart).length) waiterMode = false;
  saveCart();
  renderAll();
}

function totals() {
  let sub = 0, count = 0;
  for (const k in cart) { sub += lineUnit(cart[k]) * cart[k].qty; count += cart[k].qty; }
  const svc = Math.round(sub * CONFIG.serviceRate);
  return { sub, count, svc, total: sub + svc };
}

// ===== Кнопки количества =====
function ctlHtml(ctl) {
  if (ctl.indexOf('a:') === 0) {
    const id = ctl.slice(2);
    const n = qtyFor(id);
    return `<button class="add" type="button" data-act="open" data-id="${esc(id)}" aria-label="${esc(t('add'))}">+</button>` +
           (n ? `<span class="count">${n}</span>` : '');
  }
  const q = cart[ctl] ? cart[ctl].qty : 0;
  if (!q) return `<button class="add" type="button" data-act="inc" data-key="${esc(ctl)}" aria-label="${esc(t('add'))}">+</button>`;
  return `<button class="qbtn" type="button" data-act="dec" data-key="${esc(ctl)}" aria-label="−">−</button>` +
         `<span class="count">${q}</span>` +
         `<button class="qbtn" type="button" data-act="inc" data-key="${esc(ctl)}" aria-label="+">+</button>`;
}

// ===== Отрисовка меню =====
// Фото блюд: assets/dishes/<id>.jpg (например mains-4). Нет файла — фото просто убирается.
function itemHtml(it) {
  const price = it.p == null ? t('tba') : fmt(it.p);
  const ctl = it.p != null ? `<div class="ctl">${ctlHtml(it.a ? 'a:' + it.id : it.id)}</div>` : '';
  const desc = descOf(it);
  return `<div class="item">
    <div class="thumb"><img src="assets/dishes/${esc(it.id)}.jpg" alt="" loading="lazy"></div>
    <div class="info">
      <div class="name">${esc(nm(it))}</div>
      ${desc ? `<div class="desc">${esc(desc)}</div>` : ''}
      <div class="foot"><div class="price">${price}</div>${ctl}</div>
    </div>
  </div>`;
}

function listHtml(cid) {
  let html = '', lastGroup = null;
  for (const it of CATS[cid].items) {
    if (it.g && it.g.ru !== lastGroup) {
      html += `<h3 class="sub">${esc(gName(it.g))}</h3>`;
      lastGroup = it.g.ru;
    }
    html += itemHtml(it);
  }
  return html;
}

function searchHtml(q) {
  const needle = q.toLowerCase();
  let html = '', count = 0;
  for (const cid of Object.keys(CATS)) {
    const hits = CATS[cid].items.filter(it => (nm(it) + ' ' + descOf(it)).toLowerCase().includes(needle));
    if (!hits.length) continue;
    count += hits.length;
    html += `<h2 class="cat">${esc(gName(CATS[cid].t))}</h2><div class="list">${hits.map(itemHtml).join('')}</div>`;
  }
  return count ? html : `<p class="empty">${esc(t('noResults'))}</p>`;
}

function ensureView() {
  if (!DEPTS[view.dept]) view.dept = 'kitchen';
  if (!DEPTS[view.dept].cats.includes(view.cat)) view.cat = DEPTS[view.dept].cats[0];
}

function renderContent() {
  const q = searchQ.trim();
  $('pills').hidden = !!q;
  if (q) {
    $('content').innerHTML = searchHtml(q);
  } else {
    ensureView();
    $('content').innerHTML = `<h2 class="cat">${esc(gName(CATS[view.cat].t))}</h2><div class="list">${listHtml(view.cat)}</div>`;
  }
}

function renderScreen() {
  const welcome = view.screen === 'welcome';
  document.documentElement.classList.toggle('menu-mode', !welcome);
  $('welcome').hidden = !welcome;
  $('menuScreen').hidden = welcome;
  if (welcome) return;

  ensureView();
  const dept = DEPTS[view.dept];
  $('depts').innerHTML = Object.keys(DEPTS).map(k => {
    const on = k === view.dept;
    return `<button class="dept${on ? ' on' : ''}" type="button" data-dept="${k}" aria-pressed="${on}">` +
      `<span class="pic"><img src="assets/dept-${k}.jpg" alt="" loading="lazy"></span>` +
      `<span class="label">${esc(gName(DEPTS[k].t))}</span></button>`;
  }).join('');
  $('pills').innerHTML = dept.cats.map(cid =>
    `<button class="pill" type="button" data-cat="${cid}" aria-pressed="${cid === view.cat}">${esc(gName(CATS[cid].t))}</button>`
  ).join('');
  renderContent();
  $('footNote').textContent = t('allergy');
}

// ===== Надписи =====
function applyStatic() {
  document.documentElement.lang = lang;
  $('langSel').value = lang;
  $('slogan').textContent = t('slogan');
  $('welcomeSub').textContent = t('sub');
  $('toMenu').textContent = t('menu');
  $('backBtn').textContent = '← ' + t('back');
  $('search').placeholder = t('searchPh');
  $('cartTitle').textContent = t('cart');
  $('tableLabel').textContent = t('table');
  $('waiterBtn').textContent = t('showWaiter');
  $('copyBtn').textContent = t('copy');
  $('waLink').textContent = t('wa');
  $('clearBtn').textContent = t('clear');
  $('modalCancel').textContent = t('cancel');
  $('modalAdd').textContent = t('addCart');

// ===== Язык и сборка =====
function setLang(l) {
  if (!LANGS.includes(l)) return;
  lang = l;
  try { localStorage.setItem('marhaba-lang', l); } catch (e) {}
  renderAll();
}

function renderAll() {
  applyStatic();
  renderScreen();
  renderBar();
  if (!$('drawer').hidden) renderCart();
}

function setupContacts() {
  const set = (id, href, on) => {
    const a = $(id);
    if (!on) { a.hidden = true; return; }
    a.href = href;
    a.hidden = false;
  };
  set('cPhone', 'tel:+' + digits(CONFIG.phone), !!digits(CONFIG.phone));
  set('cInsta', 'https://instagram.com/' + handle(CONFIG.instagram), !!handle(CONFIG.instagram));
  set('cWa', 'https://wa.me/' + digits(CONFIG.whatsapp), !!digits(CONFIG.whatsapp));
}

function setupTable() {
  const fromUrl = new URLSearchParams(location.search).get('table');
  let saved = null;
  try { saved = localStorage.getItem(TABLE_KEY); } catch (e) {}
  $('table').value = String(fromUrl || saved || '').replace(/\D/g, '').slice(0, 3);
}

// ===== Обработчики =====
function wire() {
  $('langSel').addEventListener('change', e => setLang(e.target.value));

  $('toMenu').addEventListener('click', () => {
    view = { screen: 'menu', dept: 'kitchen', cat: null };
    searchQ = ''; $('search').value = '';
    renderAll();
    window.scrollTo(0, 0);
  });
  $('backBtn').addEventListener('click', () => {
    view.screen = 'welcome';
    searchQ = ''; $('search').value = '';
    renderAll();
    window.scrollTo(0, 0);
  });
  $('search').addEventListener('input', e => { searchQ = e.target.value; renderContent(); });

  $('openCart').addEventListener('click', openDrawer);
  $('closeCart').addEventListener('click', closeDrawer);
  $('drawer').addEventListener('click', e => { if (e.target === $('drawer')) closeDrawer(); });
  $('waiterBtn').addEventListener('click', () => { waiterMode = true; renderCart(); });
  $('clearBtn').addEventListener('click', () => { cart = {}; waiterMode = false; saveCart(); setStatus(''); renderAll(); });
  $('copyBtn').addEventListener('click', copyOrder);
  $('table').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
    try { localStorage.setItem(TABLE_KEY, e.target.value); } catch (err) {}
    updateOrder();
  });
  $('modalAdd').addEventListener('click', confirmAddon);
  $('modalCancel').addEventListener('click', closeAddon);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeAddon(); });
  $('modalOpts').addEventListener('change', updateModalPrice);

  document.addEventListener('click', e => {
    const c = sel => (e.target.closest ? e.target.closest(sel) : null);
    let b;
    if ((b = c('[data-act]'))) {
      if (b.dataset.act === 'open') openAddon(b.dataset.id);
      else changeKey(b.dataset.key, b.dataset.act === 'inc' ? 1 : -1);
      return;
    }
    if ((b = c('[data-dept]'))) { view.dept = b.dataset.dept; view.cat = null; renderAll(); return; }
    if ((b = c('[data-cat]'))) { view.cat = b.dataset.cat; renderAll(); return; }
  });

  // Битые фото убираем (вместо инлайн onerror, который не проходит CSP)
  document.addEventListener('error', e => {
    const img = e.target;
    if (img && img.tagName === 'IMG' && img.closest && img.closest('.thumb, .pic')) img.remove();
  }, true);
}

function init() {
  const steps = [wire, setupContacts, setupTable, renderAll];
  for (const step of steps) {
    try { step(); } catch (err) { console.error('Marhaba init:', err); }
  }
}


// ===== Корзина: панель, список, заказ =====
function renderBar() {
  const tot = totals();
  // Панель корзины только в меню и только если есть позиции (без цен)
  $('bar').hidden = view.screen !== 'menu' || tot.count === 0;
  $('barCount').textContent = `${t('cart')} · ${tot.count}`;
}

function renderCart() {
  const keys = Object.keys(cart);
  // Список без цен: только то, что набрали
  $('cartLines').innerHTML = keys.length
    ? keys.map(k => {
        const e = cart[k];
        return `<div class="line">
          <div class="info"><div class="name">${esc(lineName(e))}</div></div>
          <div class="ctl">${ctlHtml(k)}</div>
        </div>`;
      }).join('')
    : `<p class="empty">${t('cartEmpty')}</p>`;

  $('waiterBtn').hidden = !keys.length || waiterMode;
  $('billBox').hidden = !waiterMode;
  if (waiterMode) {
    const tot = totals();
    $('totals').innerHTML =
      `<div class="row"><span>${t('sum')}</span><span>${fmt(tot.sub)}</span></div>` +
      `<div class="row"><span>${t('service')} ${pct()}</span><span>${fmt(tot.svc)}</span></div>` +
      `<div class="row big"><span>${t('total')}</span><span>${fmt(tot.total)}</span></div>`;
    updateOrder();
  }
}

function buildOrder() {
  const tot = totals();
  const table = $('table').value;
  const lines = Object.keys(cart).map(k => {
    const e = cart[k];
    return `${lineName(e)} × ${e.qty} — ${fmt(lineUnit(e) * e.qty)}`;
  });
  return t('orderTitle') +
    (table ? `\n${t('tableWord')}${table}` : '') +
    '\n\n' + (lines.length ? lines.join('\n') : t('cartEmpty')) +
    `\n\n${t('sum')}: ${fmt(tot.sub)}` +
    `\n${t('service')} ${pct()}: ${fmt(tot.svc)}` +
    `\n${t('total')}: ${fmt(tot.total)}`;
}

function updateOrder() {
  const text = buildOrder();
  $('orderText').value = text;
  if (digits(CONFIG.whatsapp)) {
    $('waLink').href = 'https://wa.me/' + digits(CONFIG.whatsapp) + '?text=' + encodeURIComponent(text);
    $('waLink').hidden = false;
  } else {
    $('waLink').hidden = true;
  }
}

function setStatus(msg) { $('status').textContent = msg; }

function copyOrder() {
  if (!Object.keys(cart).length) { setStatus(t('copyEmpty')); return; }
  const text = $('orderText').value;
  const done = () => setStatus(t('copied'));
  const fallback = () => {
    const ta = $('orderText');
    ta.removeAttribute('readonly');
    ta.select();
    ta.setAttribute('readonly', '');
    try { document.execCommand('copy'); done(); }
    catch (e) { setStatus(text); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

function openDrawer() { waiterMode = false; $('drawer').hidden = false; renderCart(); }
function closeDrawer() { waiterMode = false; $('drawer').hidden = true; }

// ===== Выбор добавки (чай) =====
function openAddon(id) {
  addonFor = id;
  const it = ITEMS[id];
  $('modalTitle').textContent = nm(it);
  const opts = [['', t('nothing')], ['lemon', t('lemon')], ['honey', t('honey')]];
  $('modalOpts').innerHTML = opts.map(([k, label], i) =>
    `<label class="radio"><span><input type="radio" name="addon" value="${k}" ${i === 0 ? 'checked' : ''}>${esc(label)}</span><span>${k ? '+' + fmt(ADDONS[k].p) : ''}</span></label>`
  ).join('');
  updateModalPrice();
  $('modal').hidden = false;
}
function updateModalPrice() {
  const sel = document.querySelector('input[name="addon"]:checked');
  const addon = sel ? sel.value : '';
  $('modalPrice').textContent = fmt(ITEMS[addonFor].p + (addon ? ADDONS[addon].p : 0));
}
function confirmAddon() {
  const sel = document.querySelector('input[name="addon"]:checked');
  const addon = sel ? sel.value : '';
  $('modal').hidden = true;
  changeKey(keyFor(addonFor, addon), 1);
}
function closeAddon() { $('modal').hidden = true; }



init();
</script>
